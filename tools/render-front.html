<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Render frontal</title></head><body style="margin:0">
<!-- Genera una imagen frontal (fondo transparente) de un modelo procedural: render-front.html?b=<builder>&fn=<función> -->
<script src="../assets/vendor/three/three.min.js"></script>
<script src="../assets/vendor/three/RoomEnvironment.js"></script>
<script src="kalerm-e50/RoundedBoxGeometry.js"></script>
<script src="model-kit.js"></script>
<script>
var q = new URLSearchParams(location.search);
window.renderFront = function () {
  return new Promise(function (res) {
    var s = document.createElement('script'); s.src = q.get('b'); s.onload = function () {
      (ModelKit.logoReady || Promise.resolve()).then(function () {
        THREE.ColorManagement.legacyMode = false;
        var W = 1000, H = 1250, r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
        r.setSize(W, H); r.outputEncoding = THREE.sRGBEncoding; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
        document.body.appendChild(r.domElement);
        var sc = new THREE.Scene(), pm = new THREE.PMREMGenerator(r);
        sc.environment = pm.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
        var key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(0.5, 2.5, 2); sc.add(key);
        sc.add(new THREE.HemisphereLight(0xffffff, 0xbdb8b0, 0.35));
        var m = window[q.get('fn')](THREE); sc.add(m);
        m.traverse(function (o) { if (o.isMesh && o.material) {
          if (/^(display|led|logo_corporate)/.test(o.material.name)) o.material.toneMapped = false;
          if (o.material.transmission > 0) { o.material.transmission = 0; o.material.transparent = true; o.material.opacity = 0.35; o.material.depthWrite = false; }
        } });
        var box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3()), sz = box.getSize(new THREE.Vector3());
        var cam = new THREE.PerspectiveCamera(8, W / H, 0.1, 100), dist = Math.max(sz.y, sz.x * H / W) / 2 / Math.tan(4 * Math.PI / 180) * 1.08;
        cam.position.set(c.x, c.y + sz.y * 0.04, box.max.z + dist); cam.lookAt(c.x, c.y, c.z);
        r.render(sc, cam); res(r.domElement.toDataURL('image/png'));
      });
    }; document.body.appendChild(s);
  });
};
</script></body></html>
